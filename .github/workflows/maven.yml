# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Test Automation Framework

on:
  schedule:
    - cron: 00 18 * * *
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: Running Test Automation framwork with Maven
        run: mvn test -X -Dbrowser=chrome -DisLambdaTest=false -DisHeadless=true

      - name: Upload Test logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Test logs
          path: logs/

      - name: Upload Screenshots as artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots
          path: screenshots/

      - name: Upload HTML reports as artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: html-report
          path: report.html

      - name: Test Execution status
        run: echo "Test Execution Completed"

      - name: Copy reports to github pages
        if: always()
        run: |
          mkdir -p public/extent-reports/screenshots/
          cp -R report.html public/extent-reports/
          cp -R screenshots/*public/extent-reports/screenshots/
          ls -l

      - name: Deploy
        if: always()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public/extent-reports/
          token: ${{ secrets.AUTOMATIO_FRAME }}
          clean: true
